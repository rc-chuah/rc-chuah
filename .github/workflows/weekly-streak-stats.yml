name: Update weekly streak stats

on:
  schedule: # Execute every 24 hours
    - cron: "0 0 * * *"
  push:
    # Run any time this branch is modified
    branches:
      - main
    paths: # Run any time this file is modified
      - ".github/workflows/weekly-streak-stats.yml"
  # Run manually from the Actions tab
  workflow_dispatch:

# Prevent two instances from updating main simultaneously.
concurrency:
  group: weekly-streak-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate weekly streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&mode=weekly&theme=chartreuse-dark
          path: profile/weekly-streak.svg
          token: ${{ secrets.STREAK_STATS_GITHUB_TOKEN }}

      - name: Commit and push weekly streak stats
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/weekly-streak.svg

          # Exit successfully when the generated file did not change.
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update weekly streak stats"

          # Rebase on the latest main and retry if another update wins the race.
          for attempt in {1..5}; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after 5 attempts."
          exit 1
